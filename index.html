<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國光英雄網 - 英語學習與集章認證平台</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="app">
  <header>
    <div class="header-container">
      <div class="header-brand" style="cursor: pointer;" onclick="go('home')" title="點擊返回首頁">
        <h1>🦸 國光英雄網 </h1>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="theme-toggle-btn" id="bgmToggle" onclick="toggleBGM()">
          <span id="bgmIcon">🎵</span> <span id="bgmText">音樂：開啟</span>
        </button>
        <button class="theme-toggle-btn" id="soundToggle" onclick="toggleSound()">
          <span id="soundIcon">🔊</span> <span id="soundText">音效：開啟</span>
        </button>
        <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span> <span id="themeText">切換模式</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="nav" id="nav"></nav>
    <div id="view"></div>
  </main>

  <footer style="text-align: center; padding: 20px; margin-top: 40px; border-top: 1px solid var(--border);">
    <button class="secondary" style="font-size: 0.85rem;" onclick="openHelp()">❓ 檢視認證制度與兌獎說明</button>
  </footer>
</div>

<div id="modalRoot"></div>

<script src="questions.js"></script>
<script>
const ALL_TOPICS = [
  "單字-A.數字與時間",
  "單字-B.顏色與形容詞",
  "單字-C.人物、家人與職業",
  "單字-D.身體健康與症狀",
  "單字-E.服裝與配件",
  "單字-F.學校、文具與學科",
  "單字-G.動物",
  "單字-H.食物、飲料與水果",
  "單字-I.節慶與重要傳統",
  "單字-J.現代科技與生活",
  "單字-K.地點與交通",
  "單字-L.介係詞與代名詞",
  "第二部分：日常生活與教室用語",
  "第三部分：核心問答句型"
];

const LEVEL_CONFIGS = {
  1: { name: "Level 1: 初心者基本功 (25題)", total: 25,  passRate: 0.80, reqCorrect: 20, timeLimitMin: null, poolFilter: 1, stampKey: "challenge_lvl1", badgeName: "🌱 國光英語小達人", icon: "🌱" },
  2: { name: "Level 2: 50週年校慶挑戰 (50題)", total: 50,  passRate: 0.80, reqCorrect: 40, timeLimitMin: null, poolFilter: 2, stampKey: "challenge_lvl2", badgeName: "🥉 50週年校慶榮譽證書", icon: "🥉" },
  3: { name: "Level 3: 全國檢測達標 (100題)", total: 100, passRate: 0.91, reqCorrect: 91, timeLimitMin: 60,  poolFilter: 3, stampKey: "challenge_lvl3", badgeName: "🥈 全國檢測達標證書", icon: "🎓" },
  4: { name: "Level 4: 325巷內人特訓 (30題)", total: 30,  passRate: 0.85, reqCorrect: 26, timeLimitMin: 25,  poolFilter: 3, stampKey: "challenge_lvl4", badgeName: "🥇 325巷內英語通認證", icon: "🏫" },
  5: { name: "Level 5: 435終極戰 (30題)", total: 30,   passRate: 0.90, reqCorrect: 27, timeLimitMin: 25,  poolFilter: 3, stampKey: "challenge_lvl5", badgeName: "🏆 435終極勇士突破金章", icon: "🚀" }
};

let state = {
  page: 'home',
  name: localStorage.getItem('kgName') || '',
  selectedGradeLevel: 0,
  topic: null,
  currentLevel: 1,
  quiz: [],
  idx: 0,
  userSelections: {}, 
  submittedQuestions: {}, 
  answers: [],
  mode: 'topic',
  correctCount: 0,
  totalAnswered: 0,
  deadline: null,
  bgmEnabled: true,
  soundEnabled: true,
  history: JSON.parse(localStorage.getItem('kgHistory') || '[]'),
  stamps: JSON.parse(localStorage.getItem('kgStamps') || '{}')
};

let bgmInterval = null;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pages = [
  ['home', '🏵️ 勇者集章冊'],
  ['topics', '📚 主題修練'],
  ['challenges', '🏆 關卡挑戰賽'],
  ['vocab', '📖 英雄單字大全']
];

function pickABQuestions(sourcePool) {
  let groups = {};
  sourcePool.forEach(q => {
    let key = q.groupKey || q.id;
    (groups[key] ??= []).push(q);
  });

  let selected = [];
  Object.values(groups).forEach(versions => {
    let picked = shuffle(versions)[0];
    selected.push(picked);
  });
  return shuffle(selected);
}

function renderNav() {
  const navEl = $('nav');
  if (!navEl) return;
  navEl.innerHTML = pages.map(([id, name]) => 
    `<button class="${state.page === id ? 'active' : ''}" onclick="go('${id}')">${name}</button>`
  ).join('');
}

function go(p) {
  stopBGM();
  if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }
  state.page = p;
  renderNav();
  render();
}

function render() {
  renderNav();
  const v = $('view');
  if (!v) return;
  if (state.page === 'home') home(v);
  if (state.page === 'topics') topics(v);
  if (state.page === 'challenges') challenges(v);
  if (state.page === 'vocab') vocabPage(v);
}

function home(v) {
  stopBGM();
  let unlockedTopics = Object.keys(state.stamps).filter(k => !['king', 'challenge_50', 'challenge_100', 'challenge_30', 'challenge_325'].includes(k)).length;

  v.innerHTML = `
    <div id="stampCardContainer">
      <section class="panel heroMain">
        <span class="pill gold">⚔️ 勇者冒險日誌</span>
        <h2 style="margin:10px 0;">🛡️ 歡迎來到國光英雄網，勇者 ${esc(state.name || '無名勇者')} 請闖關！</h2>
        <p>傳說中，唯有集滿四大主題奧義與突破五大極限關卡的勇者，才能斬斷英語迷思魔王！準備好接受試煉了嗎？</p>
        <div class="row" style="margin-top:14px;">
          <button class="gold" onclick="go('topics')">開始主題集章</button>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="gold" onclick="downloadStampImage()">📸 下載集章卡圖片</button>
            <button class="secondary" onclick="exportHistory()">📥 匯出備份檔</button>
            <button class="secondary" onclick="$('importFileInput').click()">📤 匯入備份檔</button>
            <input type="file" id="importFileInput" accept=".csv" style="display:none;" onchange="importHistory(event)">
          </div>
        </div>
      </section>

      <div class="kpis">
        <div class="kpi">
          <strong>${unlockedTopics} / ${ALL_TOPICS.length}</strong>
          <span>主題章</span>
        </div>
        ${Object.values(LEVEL_CONFIGS).map(cfg => {
          let st = state.stamps[cfg.stampKey];
          return `
            <div class="kpi">
              <strong>${st ? '已獲得' : '未解鎖'}</strong>
              <span>${cfg.name.split(':')[0]}</span>
            </div>
          `;
        }).join('')}
      </div>

      <section class="panel">
        <h3>🎖️ 五大等級榮譽挑戰賽卡冊</h3>
        <div class="challenge-cards-grid">
          ${Object.entries(LEVEL_CONFIGS).map(([lvlKey, cfg]) => {
            let st = state.stamps[cfg.stampKey];
            return `
              <div class="hero-photo-card ${st ? 'unlocked' : 'locked'}" style="cursor:pointer;" onclick="${!st ? "startLevel(" + lvlKey + ")" : ""}">
                <div class="hero-img-wrapper" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6);">
                  <div class="placeholder-medal">${cfg.icon}</div>${!st ? `
                    <div class="lock-overlay">
                      <span class="lock-icon">🔒</span>
                      <span class="lock-text">點擊挑戰 (${cfg.passRate*100}%)</span>
                    </div>
                  ` : ''}
                </div>
                <div class="hero-card-info">
                  <h4>${cfg.badgeName}</h4>
                  <p class="status-desc">${st ? `高分：${st.score}分` : `門檻：${cfg.passRate*100}%`}</p>
                  ${st ? `<button class="gold" style="padding:4px 12px; font-size:0.8rem; width:100%;" onclick="event.stopPropagation(); openCert('${esc(cfg.name)}', '${cfg.icon}')">📜 檢視證書</button>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>

      <section class="panel">
        <h3>📚 十四大主題集點章 (答對率 80% 解鎖)</h3>
        <div class="stamp-grid">
          ${ALL_TOPICS.map(t => {
            let st = state.stamps[t];
            return `
              <div class="stamp-card ${st ? 'unlocked' : ''}" onclick="startTopic('${encodeURIComponent(t)}')">
                <div class="stamp-card-body">
                  <div class="stamp-icon">${st ? '🌱' : '🔒'}</div>
                  <div class="stamp-title">${esc(t.replace('單字-', ''))}</div>
                  <div class="stamp-status">${st ? `高分：${st.score}分` : '點擊開始測驗'}</div>
                  ${st ? `<div class="stamp-date">${st.date}</div>` : ''}
                </div>
                <div class="stamp-card-action">
                  ${st ? `<button class="gold cert-btn" onclick="event.stopPropagation(); openCert('${esc(t)}', '🏅')">📜 檢視證書</button>` : `<button class="secondary start-btn">開始測驗</button>`}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    </div>
  `;
}

function challenges(v) {
  stopBGM();
  v.innerHTML = `
    <div class="panel">
      <h2>🏆 國光英語五大等級挑戰賽</h2>
      <p class="muted">選擇你要挑戰的關卡，達成高分門檻即可解鎖對應的榮譽章！</p>
      
      <div class="field">
        <label>學生姓名：</label>
        <input id="challengeName" value="${esc(state.name)}" placeholder="請輸入姓名" onchange="saveName(this.value)">
      </div>

      <div class="grid">
        ${Object.entries(LEVEL_CONFIGS).map(([lvl, cfg]) => `
          <div class="card">
            <div>
              <div class="card-header">
                <h3 class="card-title">${cfg.name}</h3>
                <span class="pill ${lvl==='5'?'gold':''}">${cfg.total} 題</span>
              </div>
              <p class="muted" style="font-size:0.85rem; margin:10px 0;">
                晉級門檻：<b>${cfg.passRate * 100}\% (答對 ${cfg.reqCorrect} 題)</b><br>
                時間限制：<b>${cfg.timeLimitMin ? cfg.timeLimitMin + ' 分鐘' : '無限制'}</b>
              </p>
            </div>
            <button class="gold" onclick="startLevel(${lvl})">開始 ${cfg.name}</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function startLevel(lvlKey) {
  saveName($('challengeName')?.value || state.name);
  if (!state.name) { alert('請先輸入學生姓名！'); return; }

  state.currentLevel = Number(lvlKey);
  const cfg = LEVEL_CONFIGS[lvlKey];

  let pool = DATA.questions.filter(q => (q.gradeLevel || 1) <= cfg.poolFilter);
  let picked = pickABQuestions(pool);
  
  while (picked.length < cfg.total) {
    picked = picked.concat(pickABQuestions(pool));
  }
  picked = picked.slice(0, cfg.total);

  resetExamState();
  state.quiz = picked;
  state.mode = 'challenge';
  state.topic = cfg.name;

  if (cfg.timeLimitMin) {
    state.deadline = Date.now() + cfg.timeLimitMin * 60 * 1000;
    startTimer();
  }

  prepareQuestionsData();
  startBGM();
  renderQuiz();
}

function openCert(topicTitle, badgeIcon = '🏅') {
  let certName = state.name || '國光小英雄';
  
  $('modalRoot').innerHTML = `
    <div class="modal" onclick="if(event.target===this)closeHelp()">
      <div class="modalbox cert-modal-box">
        <p class="cert-school-name">新北市板橋區國光國民小學</p>
        <h1 class="cert-modal-title">🏅 英語學習榮譽認證書</h1>
        <div class="cert-badge-icon">${badgeIcon}</div>
        <p class="cert-student-line">
          茲證明學生 <span class="cert-student-name">${esc(certName)}</span>
        </p>
        <p class="cert-desc-text">
          參加<b>【${esc(topicTitle)}】</b>考核表現優異，成功獲得認證章！
        </p>
        <div class="cert-btn-group">
          <button class="gold" onclick="printCertFromModal('${esc(topicTitle)}', '${badgeIcon}')">🖨️ 列印此證書</button>
          <button class="secondary" onclick="closeHelp()">關閉</button>
        </div>
      </div>
    </div>
  `;
}

function printCertFromModal(topicTitle, badgeIcon) {
  let certName = state.name || '國光小英雄';
  downloadResultDirect(certName, topicTitle, badgeIcon);
}

function downloadStampImage() {
  const container = document.getElementById('stampCardContainer');
  if (!container) return;

  alert('正在匯出認證集章卡圖片，請稍候...');

  html2canvas(container, {
    backgroundColor: getComputedStyle(document.body).backgroundColor,
    scale: 2
  }).then(canvas => {
    let a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `國光英雄網_認證集章卡_${state.name || '學生'}.png`;
    a.click();
  });
}

function topics(v) {
  stopBGM();
  let allQs = (typeof DATA !== 'undefined' && DATA.questions) ? DATA.questions : [];
  let userLevel = state.selectedGradeLevel;

  let filteredQuestions = allQs.filter(q => {
    let qLevel = q.gradeLevel || 1;
    if (userLevel === 0) return true;
    if (userLevel === 1) return qLevel === 1;
    if (userLevel === 2) return qLevel <= 2;
    if (userLevel === 3) return qLevel <= 3;
    return true;
  });

  let groups = {};
  filteredQuestions.forEach(q => (groups[q.chapter] ??= []).push(q));

  v.innerHTML = `
    <div class="panel">
      <h2>📚 各主題驗證與集章</h2>
      <p class="muted">請選擇您的年級，系統將推薦適合您的主題：</p>
      
      <div class="grade-filter-group">
        <button class="grade-filter-btn ${userLevel===0?'active':''}" onclick="setGradeFilter(0)">全部主題</button>
        <button class="grade-filter-btn ${userLevel===1?'active':''}" onclick="setGradeFilter(1)">🌱 低年級推薦</button>
        <button class="grade-filter-btn ${userLevel===2?'active':''}" onclick="setGradeFilter(2)">🌿 中年級推薦</button>
        <button class="grade-filter-btn ${userLevel===3?'active':''}" onclick="setGradeFilter(3)">🌳 高年級推薦</button>
      </div>

      <div class="field">
        <label>學生姓名（認證將顯示於證書與集章卡）：</label>
        <input id="studentName" value="${esc(state.name)}" placeholder="請輸入姓名" onchange="saveName(this.value)">
      </div>

      <div class="grid">
        ${ALL_TOPICS.map(t => {
          let qs = groups[t] || [];
          if (!qs.length) return '';
          let st = state.stamps[t];
          let groupCount = new Set(qs.map(q => q.groupKey || q.id)).size;
          return `
            <div class="card">
              <div>
                <div class="card-header">
                  <h3 class="card-title">${esc(t)}</h3>
                  <span class="pill">${groupCount} 題</span>
                </div>
                <div class="progress"><span style="width:${st ? 100 : 0}%"></span></div>
              </div>
              <button onclick="startTopic('${encodeURIComponent(t)}')" style="margin-top:14px; width:100%;">
                ${st ? '再次挑戰 (已蓋章)' : '開始測驗'}
              </button>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function setGradeFilter(lvl) {
  state.selectedGradeLevel = lvl;
  render();
}

function saveName(val) {
  state.name = val.trim();
  localStorage.setItem('kgName', state.name);
}

function startTopic(enc) {
  saveName($('studentName')?.value || state.name);
  state.topic = decodeURIComponent(enc);
  
  let allQs = DATA.questions;
  let userLevel = state.selectedGradeLevel;

  let pool = allQs.filter(q => {
    if (q.chapter !== state.topic) return false;
    let qLevel = q.gradeLevel || 1;
    if (userLevel === 0) return true;
    if (userLevel === 1) return qLevel === 1;
    if (userLevel === 2) return qLevel <= 2;
    if (userLevel === 3) return qLevel <= 3;
    return true;
  });

  resetExamState();
  state.quiz = pickABQuestions(pool);
  state.mode = 'topic';
  prepareQuestionsData();
  startBGM();
  renderQuiz();
}

function resetExamState() {
  state.idx = 0;
  state.userSelections = {};
  state.submittedQuestions = {};
  state.answers = [];
  state.correctCount = 0;
  state.totalAnswered = 0;
}

function prepareQuestionsData() {
  state.quiz.forEach((q) => {
    if (!q.shuffledOptions) {
      let options = q.options.length ? q.options : ['O', 'X'];
      q.shuffledOptions = shuffle(options.map((text, i) => ({ text, orig: i })));
    }
  });
}

function startTimer() {
  if (window.kgTimer) clearInterval(window.kgTimer);
  
  window.kgTimer = setInterval(() => {
    let remain = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
    let el = $('timerText');
    if (el) {
      let mins = String(Math.floor(remain / 60)).padStart(2, '0');
      let secs = String(remain % 60).padStart(2, '0');
      el.textContent = `${mins}:${secs}`;
    }

    if (remain <= 0) {
      clearInterval(window.kgTimer);
      window.kgTimer = null;
      alert('⏰ 時間到！系統將自動為您交卷結算成績。');
      finishQuiz();
    }
  }, 1000);
}

function renderQuiz() {
  let q = state.quiz[state.idx];
  if (!q) { finishQuiz(); return; }

  let v = $('view');
  let isSubmitted = !!state.submittedQuestions[state.idx];
  let selectedIndex = state.userSelections[state.idx];

  let initialTimerText = "";
  if (state.deadline) {
    let remain = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
    let mins = String(Math.floor(remain / 60)).padStart(2, '0');
    let secs = String(remain % 60).padStart(2, '0');
    initialTimerText = `${mins}:${secs}`;
  }

  let targetAnsText = q.options[q.answer.charCodeAt(0) - 65] || q.answer;
  let praiseWord = state.quiz[state.idx].praiseWord || "Great";

  let accuracy = state.totalAnswered > 0 
    ? Math.round((state.correctCount / state.totalAnswered) * 100) 
    : 100;

  v.innerHTML = `
    <div class="panel quiz-panel">
      <div class="row">
        <div>
          <span class="pill">${esc(q.chapter)}</span>
        </div>
        <span class="muted">
          ${state.deadline ? `⏱️ 剩餘時間：<b id="timerText" style="color:#ef4444;">${initialTimerText}</b> ・ ` : ''}
          第 ${state.idx + 1} / ${state.quiz.length} 題 （即時答對率：<b style="color:#22c55e;">${accuracy}%</b>）
        </span>
      </div>
      <div class="progress"><span style="width:${((state.idx + 1) / state.quiz.length) * 100}%"></span></div>
      
      <div class="qtext">${esc(q.question)}</div>

<div class="row quiz-action-row" style="margin-bottom: 16px; margin-top: 10px;">
        <!-- 1. 將主要的送出/下一題按鈕移到左邊 -->
        ${isSubmitted ? `
          ${state.idx === state.quiz.length - 1 ? 
            `<button class="gold" onclick="finishQuiz()">完成結算 🏆</button>` : 
            `<button class="gold" onclick="nextQuestion()">下一題 ➡️</button>`
          }
        ` : `
          <button id="submitBtn" ${selectedIndex === undefined ? 'disabled' : ''} onclick="submitAnswer()" class="gold">送出答案</button>
        `}

        <!-- 2. 次要按鈕（上一題、離開測驗）移至右側 -->
        <div style="display: flex; gap: 8px;">
          ${state.idx > 0 ? `<button class="secondary" onclick="prevQuestion()">⬅️ 上一題</button>` : ''}
          <button class="secondary" onclick="leaveQuiz()">離開測驗</button>
        </div>
      </div>

      <div class="options">
        ${q.shuffledOptions.map((o, i) => {
          let btnClass = "";
          if (isSubmitted) {
            if (o.text === targetAnsText) {
              btnClass = "correct";
            } else if (i === selectedIndex && o.text !== targetAnsText) {
              btnClass = "wrong";
            }
          } else if (i === selectedIndex) {
            btnClass = "selected";
          }

          return `
            <button id="opt${i}" class="${btnClass}" onclick="selectOption(${i})">
              <span class="opt-prefix">${String.fromCharCode(65 + i)}</span>
              <span class="opt-text">${esc(o.text)}</span>
            </button>
          `;
        }).join('')}
      </div>

      <div id="feedback">
        ${isSubmitted ? `
          <div class="feedback ${q.shuffledOptions[selectedIndex]?.text === targetAnsText ? 'pass' : 'fail'}">
            <b>${q.shuffledOptions[selectedIndex]?.text === targetAnsText ? `🎉 ${praiseWord}! 答對了！` : '❌ 答錯囉，再接再勵！'}</b>
            <p style="white-space: pre-line; line-height: 1.6; margin-top: 8px;">${esc(q.explanation)}</p>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function selectOption(i) {
  if (state.submittedQuestions[state.idx]) return;
  state.userSelections[state.idx] = i;

  for (let bIdx = 0; bIdx < state.quiz[state.idx].shuffledOptions.length; bIdx++) {
    let btn = $(`opt${bIdx}`);
    if (btn) btn.classList.remove('selected');
  }

  let selBtn = $(`opt${i}`);
  if (selBtn) selBtn.classList.add('selected');

  $('submitBtn').disabled = false;
}

function submitAnswer() {
  let selectedIndex = state.userSelections[state.idx];
  if (selectedIndex === undefined || state.submittedQuestions[state.idx]) return;

  state.submittedQuestions[state.idx] = true;
  state.totalAnswered++;

  let q = state.quiz[state.idx];
  let selectedText = q.shuffledOptions[selectedIndex].text;
  let targetAnsText = q.options[q.answer.charCodeAt(0) - 65] || q.answer;
  let isCorrect = (selectedText === targetAnsText);

  if (isCorrect) {
    state.correctCount++;
    const praiseList = ["Great", "Good", "Nice", "Perfect"];
    let randomPraise = praiseList[Math.floor(Math.random() * praiseList.length)];
    state.quiz[state.idx].praiseWord = randomPraise;
    playCorrectFeedback(randomPraise);
  } else {
    playWrongFeedback();
  }

  renderQuiz();
}

function prevQuestion() {
  if (state.idx > 0) {
    state.idx--;
    renderQuiz();
  }
}

function nextQuestion() {
  if (state.idx < state.quiz.length - 1) {
    state.idx++;
    renderQuiz();
  }
}

function leaveQuiz() { 
  if (confirm("確定要離開測驗嗎？未完成的成績將不會被儲存。")) {
    stopBGM();
    if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }
    go('home'); 
  }
}

function finishQuiz() {
  stopBGM();
  if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }

  let total = state.quiz.length;
  let correct = state.correctCount;
  let score = total > 0 ? Math.round((correct / total) * 100) : 0;

  let reqScore = 80;
  if (state.mode === 'challenge') {
    let cfg = LEVEL_CONFIGS[state.currentLevel];
    reqScore = cfg ? cfg.passRate * 100 : 80;
  }

  let isPass = score >= reqScore;
  
  let stampKey = state.mode === 'challenge' 
    ? LEVEL_CONFIGS[state.currentLevel].stampKey 
    : state.topic;

  let badgeIcon = isPass 
    ? (LEVEL_CONFIGS[state.currentLevel]?.icon || '🏅') 
    : '💪';

  if (isPass) playVictorySound();

  let dateStr = new Date().toLocaleDateString('zh-TW');
  if (isPass) {
    state.stamps[stampKey] = {
      score, date: dateStr, name: state.name || '國光小英雄'
    };
    localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
  }

  state.history.unshift({
    date: new Date().toLocaleString('zh-TW', { hour12: false }),
    name: state.name || '國光小英雄',
    title: state.topic, score, correct, total, isPass
  });
  localStorage.setItem('kgHistory', JSON.stringify(state.history));

  $('view').innerHTML = `
    <div class="panel" style="text-align:center;">
      <div style="font-size:4rem">${badgeIcon}</div>
      <h2>${esc(state.topic)} - 測驗結果</h2>
      <p class="muted">英雄玩家：<b>${esc(state.name || '國光小英雄')}</b></p>
      <div style="font-size:3rem; font-weight:900; color:${isPass ? '#22c55e' : '#f3b63f'};">${score} 分</div>
      <p>答對 ${correct} 題 / 共 ${total} 題</p>

      <div class="notice">
        <b>認證印章狀況：${isPass ? '成功解鎖認證章！' : '未達標準（需 ' + reqScore + '%）'}</b><br>
        ${isPass ? '恭喜成功蓋章！已為您儲存至【我的認證集章冊】中。' : '再試一次即可順利解鎖印章！'}
      </div>

      <div class="row" style="justify-content:center;">
        ${isPass ? `<button class="gold" onclick="downloadResult()">📜 列印 / 下載認證證書</button>` : ''}
        <button class="secondary" onclick="go('home')">檢視我的集章冊</button>
      </div>
    </div>
  `;
}

function importHistory(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n');
    let importedCount = 0;

    for (let i = 1; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) continue;

      let cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      if (!cols || cols.length < 4) continue;

      let title = cols[0].replace(/"/g, '').trim();
      let score = parseInt(cols[1].replace(/"/g, '').trim(), 10);
      let date = cols[2].replace(/"/g, '').trim();
      let name = cols[3].replace(/"/g, '').trim();

      let key = title.includes('425') ? 'king' 
              : title.includes('325') ? 'challenge_325'
              : title.includes('100') ? 'challenge_100' 
              : title.includes('50') ? 'challenge_50' 
              : title.includes('30') ? 'challenge_30'
              : title;

      if (!state.stamps[key] || score >= state.stamps[key].score) {
        state.stamps[key] = { score, date, name };
        importedCount++;
      }

      if (name && !state.name) {
        saveName(name);
      }
    }

    if (importedCount > 0) {
      localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
      alert(`🎉 成功匯入並更新了 ${importedCount} 項認證紀錄！`);
      render();
    } else {
      alert('⚠️ 備份檔中無新紀錄，或分數未高於現有紀錄。');
    }
    event.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function exportHistory() {
  if (!Object.keys(state.stamps).length && !state.history.length) {
    alert('目前尚無集章與歷程紀錄！'); return;
  }
  let csv = "\uFEFF認證項目/主題,高分紀錄,獲章日期,英雄姓名\n";
  Object.entries(state.stamps).forEach(([k, v]) => {
    let title = (k==='king')?'425英雄金章':(k==='challenge_325')?'325題金章':(k==='challenge_100')?'100題銀章':(k==='challenge_50')?'50題銅章':(k==='challenge_30')?'30題新手章':k;
    csv += `"${title}",${v.score},"${v.date}","${v.name}"\n`;
  });
  let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `國光英雄網_認證集章冊_${state.name||'學生'}.csv`;
  a.click();
}

function downloadResult() {
  let stampKey = state.mode === 'challenge' ? LEVEL_CONFIGS[state.currentLevel].stampKey : state.topic;
  let badgeIcon = LEVEL_CONFIGS[state.currentLevel]?.icon || '🏅';
  downloadResultDirect(state.name || '國光小英雄', state.topic, badgeIcon);
}

function toggleTheme() {
  let dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('themeIcon').textContent = dark ? '🌙' : '☀️';
}

function toggleSound() {
  state.soundEnabled = !state.soundEnabled;
  $('soundIcon').textContent = state.soundEnabled ? '🔊' : '🔇';
  $('soundText').textContent = state.soundEnabled ? '音效：開啟' : '音效：靜音';
}

function toggleBGM() {
  state.bgmEnabled = !state.bgmEnabled;
  $('bgmIcon').textContent = state.bgmEnabled ? '🎵' : '🔇';
  $('bgmText').textContent = state.bgmEnabled ? '音樂：開啟' : '音樂：靜音';
  
  if (!state.bgmEnabled) {
    stopBGM();
  } else if (state.quiz && state.quiz.length && state.submittedQuestions) {
    startBGM();
  }
}

function startBGM() {
  if (!state.bgmEnabled || bgmInterval) return;
  
  let ctx = getAudioContext();
  let step = 0;
  const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 349.23];

  bgmInterval = setInterval(() => {
    if (!state.bgmEnabled) return;
    try {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
      
      gain.gain.setValueAtTime(0.04, ctx.currentTime); 
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
      step++;
    } catch(e) {}
  }, 220);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function speakText(text) {
  if (!state.soundEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.7;
  window.speechSynthesis.speak(u);
}

function playCorrectFeedback(word) {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.28);
  } catch(e) {}
  
  setTimeout(() => {
    speakText(word || "Great!");
  }, 180);
}

function playWrongFeedback() {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } catch(e) {}
}

function playVictorySound() {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.12);
      osc.stop(ctx.currentTime + idx * 0.12 + 0.45);
    });
  } catch(e) {}
}


function vocabPage(v) {
  stopBGM();
  let allQs = (typeof DATA !== 'undefined' && DATA.questions) ? DATA.questions : [];
  let vocabSet = new Map();

  allQs.forEach(q => {
    let word = q.question.match(/"([^"]+)"/);
    let meaning = q.explanation.match(/「([^」]+)」/) || q.explanation.match(/中文意思是「([^」]+)」/);
    if (word && word[1]) {
      let w = word[1];
      let m = meaning ? meaning[1] : (q.options ? q.options.join('/') : '');
      if (!vocabSet.has(w)) {
        vocabSet.set(w, { word: w, meaning: m, chapter: q.chapter, grade: q.gradeLevel || 1 });
      }
    }
  });

  let list = Array.from(vocabSet.values());

  v.innerHTML = `
    <div class="panel">
      <h2>📖 國光英雄網 - 核心單字總表大全 (${list.length} 詞)</h2>
      <p class="muted">這裡收錄了所有檢測必考核心單字，勇者可以在闖關前先來這裡背誦修練！</p>
      <div class="field" style="margin-bottom: 20px;">
        <input type="text" id="vocabSearch" placeholder="🔍 輸入英文單字或中文關鍵字搜尋..." oninput="filterVocabList(this.value)">
      </div>
      <div class="grid" id="vocabGrid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
        ${list.map(item => `
          <div class="card vocab-item" data-word="${esc(item.word.toLowerCase())}" data-meaning="${esc(item.meaning)}">
            <div style="font-size:1.2rem; font-weight:bold; color:var(--primary-light);">${esc(item.word)}</div>
            <div style="font-size:1rem; margin-top:4px; color:var(--text);">${esc(item.meaning)}</div>
            <span class="pill" style="margin-top:8px; font-size:0.75rem;">${esc(item.chapter.replace('單字-', ''))}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function filterVocabList(keyword) {
  let kw = keyword.toLowerCase().trim();
  let items = document.querySelectorAll('.vocab-item');
  items.forEach(el => {
    let w = el.getAttribute('data-word');
    let m = el.getAttribute('data-meaning');
    if (w.includes(kw) || m.includes(kw)) {
      el.style.display = 'flex';
    } else {
      el.style.display = 'none';
    }
  });
}

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  document.documentElement.dataset.theme = 'light';
  render();
});
