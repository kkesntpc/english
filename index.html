<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語英雄網 - 英語學習與集章認證平台</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="app">
  <header>
    <div class="header-container">
      <div class="header-brand" style="cursor: pointer;" onclick="go('home')" title="點擊返回首頁">
        <h1>🦸 英語英雄網 </h1>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="theme-toggle-btn" id="bgmToggle" onclick="toggleBGM()">
          <span id="bgmIcon">🎵</span> <span id="bgmText">音樂：開啟</span>
        </button>
        <button class="theme-toggle-btn" id="soundToggle" onclick="toggleSound()">
          <span id="soundIcon">🔊</span> <span id="soundText">音效：開啟</span>
        </button>
        <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">
          <span id="themeIcon">☀️</span> <span id="themeText">切換模式</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="nav" id="nav"></nav>
    <div id="view"></div>
  </main>

  <footer style="text-align: center; padding: 25px 20px; margin-top: 40px; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
      <button class="gold" style="font-size: 0.9rem;" onclick="promptChangeName(false)">✏️ 修改勇者代號 / 學生姓名</button>
      <button class="secondary" style="font-size: 0.9rem;" onclick="openHelp()">❓ 檢視認證制度與兌獎說明</button>
    </div>
    <div style="font-size: 0.85rem; color: var(--muted);">目前勇者代號：<b id="footerHeroName" style="color: var(--primary);">尚未設定</b></div>
  </footer>
</div>

<div id="modalRoot"></div>

<script src="questions.js"></script>
<script src="questions_exam.js"></script>
<script>
const ALL_TOPICS = [
  "單字-A.數字與時間",
  "單字-B.顏色與形容詞",
  "單字-C.人物、家人與職業",
  "單字-D.身體健康與症狀",
  "單字-E.服裝與配件",
  "單字-F.學校、文具與學科",
  "單字-G.動物",
  "單字-H.食物、飲料與水果",
  "單字-I.節慶與重要傳統",
  "單字-J.現代科技與生活",
  "單字-K.地點與交通",
  "單字-L.介係詞與代名詞",
  "第二部分：日常生活與教室用語",
  "第三部分：核心問答句型",
  "歷屆學檢特訓章 (須完成3次)"
];

const LEVEL_CONFIGS = {
  1: { name: "Level 1: 英語新人王 (30題)", total: 30,  passRate: 0.80, reqCorrect: 24, timeLimitMin: null, dist: {1: 30, 2: 0, 3: 0}, stampKey: "challenge_lvl1", badgeName: "🌱 英語新人王", icon: "🌱" },
  2: { name: "Level 2: 50週年校慶挑戰 (50題)", total: 50,  passRate: 0.80, reqCorrect: 40, timeLimitMin: null, dist: {1: 15, 2: 30, 3: 5}, stampKey: "challenge_lvl2", badgeName: "🥉 50週年校慶榮譽證書", icon: "🥉" },
  3: { name: "Level 3: 英語小達人 (100題)", total: 100, passRate: 0.90, reqCorrect: 90, timeLimitMin: 60,  dist: {1: 15, 2: 35, 3: 40, exam: 10}, stampKey: "challenge_lvl3", badgeName: "🥈 英語小達人證書", icon: "🎓" },
  4: { name: "Level 4: 巷子內 (325題)", total: 325,  passRate: 0.85, reqCorrect: 276, timeLimitMin: 60,  dist: {1: 60, 2: 110, 3: 155}, stampKey: "challenge_lvl4", badgeName: "🥇 325巷內英語通認證", icon: "🏫" },
  5: { name: "Level 5: 決戰435 (435題)", total: 435,   passRate: 0.90, reqCorrect: 391, timeLimitSec: 5999,  dist: {1: 80, 2: 130, 3: 210, exam: 15}, stampKey: "challenge_lvl5", badgeName: "🏆 435終極勇士突破金章", icon: "🚀" }
};

let state = {
  page: 'home',
  name: localStorage.getItem('kgName') || '',
  selectedGradeLevel: 0,
  topic: null,
  currentLevel: 1,
  quiz: [],
  idx: 0,
  userSelections: {}, 
  submittedQuestions: {}, 
  answers: [],
  mode: 'practice', // 'practice', 'official_cert', 'challenge'
  correctCount: 0,
  totalAnswered: 0,
  deadline: null,
  bgmEnabled: true,
  soundEnabled: true,
  history: JSON.parse(localStorage.getItem('kgHistory') || '[]'),
  stamps: JSON.parse(localStorage.getItem('kgStamps') || '{}')
};

let bgmInterval = null;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pages = [
  ['home', '🏵️ 勇者集章冊'],
  ['topics', '📚 主題修練'],
  ['challenges', '🏆 關卡挑戰賽'],
  ['exams', '📝 考古練功區'],
  ['vocab', '📖 英雄單字大全']
];

function pickABQuestions(sourcePool) {
  let groups = {};
  sourcePool.forEach(q => {
    let key = q.groupKey || q.id;
    (groups[key] ??= []).push(q);
  });

  let selected = [];
  Object.values(groups).forEach(versions => {
    let picked = shuffle(versions)[0];
    selected.push(picked);
  });
  return shuffle(selected);
}

function renderNav() {
  const navEl = $('nav');
  if (!navEl) return;
  navEl.innerHTML = pages.map(([id, name]) => 
    `<button class="${state.page === id ? 'active' : ''}" onclick="go('${id}')">${name}</button>`
  ).join('');
}

function go(p) {
  stopBGM();
  if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }
  state.page = p;
  renderNav();
  render();
}

function render() {
  updateFooterHeroName();
  renderNav();
  const v = $('view');
  if (!v) return;
  if (state.page === 'home') home(v);
  if (state.page === 'topics') topics(v);
  if (state.page === 'challenges') challenges(v);
  if (state.page === 'exams') examsPage(v);
  if (state.page === 'vocab') vocabPage(v);
}

function home(v) {
  // 隱藏密技：kkes 全解鎖
  if (state.name.trim().toLowerCase() === 'kkes') {
    let magicStamps = {};
    let mockDate = new Date().toLocaleDateString('zh-TW');
    ALL_TOPICS.forEach(t => { magicStamps[t] = { score: 100, date: mockDate, name: 'KKES' }; });
    Object.values(LEVEL_CONFIGS).forEach(cfg => { magicStamps[cfg.stampKey] = { score: 100, date: mockDate, name: 'KKES' }; });
    state.stamps = magicStamps;
  }

  stopBGM();
  
  // 計算考古題完成次數
  let examPassCount = state.history.filter(h => h.title.includes('歷屆學檢') && h.isPass).length;
  if (examPassCount >= 3 && !state.stamps["歷屆學檢特訓章 (須完成3次)"]) {
    state.stamps["歷屆學檢特訓章 (須完成3次)"] = {
      score: 100,
      date: new Date().toLocaleDateString('zh-TW'),
      name: state.name || '英語小英雄'
    };
    localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
  }

  let unlockedTopics = ALL_TOPICS.filter(t => !!state.stamps[t]).length;

  v.innerHTML = `
    <div id="stampCardContainer">
      <section class="panel heroMain">
        <span class="pill gold">⚔️ 勇者冒險日誌</span>
        <h2 style="margin:10px 0;">🛡️ 歡迎來到英語英雄網，勇者 ${esc(state.name || '無名勇者')} 請闖關！</h2>
        <p>傳說中，唯有集滿十五大主題奧義與突破五大極限關卡的勇者，才能斬斷英語迷思魔王！準備好接受正式試煉了嗎？</p>
        
        <div class="row" style="margin-top:14px;">
          <!-- 讓預設導向頁面明確往下捲動到集章區，或者只是提示 -->
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="gold" onclick="downloadStampImage()">📸 下載集章卡圖片</button>
            <button class="secondary" onclick="exportHistory()">📥 匯出備份檔</button>
            <button class="secondary" onclick="$('importFileInput').click()">📤 匯入備份檔</button>
            <input type="file" id="importFileInput" accept=".csv" style="display:none;" onchange="importHistory(event)">
          </div>
        </div>
      </section>

      <div class="kpis">
        <div class="kpi">
          <strong>${unlockedTopics} / ${ALL_TOPICS.length}</strong>
          <span>主題集章</span>
        </div>
        ${Object.values(LEVEL_CONFIGS).map(cfg => {
          let st = state.stamps[cfg.stampKey];
          return `
            <div class="kpi">
              <strong>${st ? '已獲得' : '未解鎖'}</strong>
              <span>${cfg.name.split(':')[0]}</span>
            </div>
          `;
        }).join('')}
      </div>

      <section class="panel">
        <h3>🎖️ 五大等級榮譽挑戰賽卡冊</h3>
        <p class="muted" style="margin-bottom:16px;">完成下方集章後，即可進行最終大挑戰！</p>
        <div class="challenge-cards-grid">
          ${Object.entries(LEVEL_CONFIGS).map(([lvlKey, cfg]) => {
            let st = state.stamps[cfg.stampKey];
            return `
              <div class="hero-photo-card ${st ? 'unlocked' : 'locked'} ${lvlKey === '3' ? 'highlight-baseline' : ''}" style="cursor:pointer;" onclick="${!st ? "startChallengeLevel(" + lvlKey + ")" : ""}">
                ${lvlKey === '3' ? '<div class="baseline-ribbon">📌 英語小達人</div>' : ''}
                <div class="hero-img-wrapper" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6);">
                  <div class="placeholder-medal">${cfg.icon}</div>${!st ? `
                    <div class="lock-overlay">
                      <span class="lock-icon">🔒</span>
                      <span class="lock-text">正式挑戰 (${cfg.passRate*100}%)</span>
                    </div>
                  ` : ''}
                </div>
                <div class="hero-card-info">
                  <h4>${cfg.badgeName}</h4>
                  <p class="status-desc">${st ? `高分：${st.score}分` : `門檻：${cfg.passRate*100}%`}</p>
                  ${st ? `<button class="gold" style="padding:4px 12px; font-size:0.8rem; width:100%;" onclick="event.stopPropagation(); openCert('${esc(cfg.name)}', '${cfg.icon}')">📜 檢視證書</button>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>

      <section class="panel">
        <h3>📚 十五大主題正式集點章 (3排×5欄對稱矩陣)</h3>
        <p class="muted" style="margin-bottom:16px; color:#b91c1c; font-weight:bold;">⚠️ 這裡的測驗是「正式考核」，難度較高（限時 10 分鐘 20 題，需達 85% 及格），通過才能蓋章！</p>
        <div class="stamp-grid">
          ${ALL_TOPICS.map(t => {
            let st = state.stamps[t];
            let isExamStamp = t.includes("歷屆學檢");
            let descText = isExamStamp 
              ? (st ? '🏆 已達成 3 次挑戰' : `特訓進度：${Math.min(examPassCount, 3)} / 3 次`) 
              : (st ? `高分：${st.score}分<br><span style="font-size:0.7rem">${st.date}</span>` : '未解鎖');

            return `
              <div class="stamp-card ${st ? 'unlocked' : ''}">
                <div class="stamp-card-body">
                  <div class="stamp-icon">${st ? (isExamStamp ? '🎖️' : '🌱') : '🔒'}</div>
                  <div class="stamp-title">${esc(t.replace('單字-', ''))}</div>
                  <div class="stamp-status">${descText}</div>
                </div>
                <div class="stamp-card-action">
                  ${st 
                    ? `<button class="gold cert-btn" onclick="event.stopPropagation(); openCert('${esc(t)}', '🏅')">📜 檢視證書</button>` 
                    : `<button class="primary start-btn" onclick="event.stopPropagation(); ${isExamStamp ? "go('exams')" : "startOfficialCertification('" + encodeURIComponent(t) + "')"}">
                        ${isExamStamp ? '前往練功區' : '正式開始集章'}
                       </button>`}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    </div>
  `;
}

function challenges(v) {
  stopBGM();
  v.innerHTML = `
    <div class="panel">
      <h2>🏆 英語五大等級挑戰賽</h2>
      <p class="muted">選擇你要挑戰的關卡，達成高分門檻即可解鎖對應的榮譽章！</p>
      
      <div class="field">
        <label>學生姓名：</label>
        <input id="challengeName" value="${esc(state.name)}" placeholder="請輸入姓名" onchange="saveName(this.value)">
      </div>

      <div class="grid">
        ${Object.entries(LEVEL_CONFIGS).map(([lvl, cfg]) => `
          <div class="card ${lvl === '3' ? 'highlight-baseline' : ''}">
            ${lvl === '3' ? '<div class="baseline-ribbon">📌 英語小達人</div>' : ''}
            <div>
              <div class="card-header">
                <h3 class="card-title">${cfg.name}</h3>
                <span class="pill ${lvl==='5'?'gold':''}">${cfg.total} 題</span>
              </div>
              <p class="muted" style="font-size:0.85rem; margin:10px 0;">
                晉級門檻：<b>${cfg.passRate * 100}\% (答對 ${cfg.reqCorrect} 題)</b><br>
                時間限制：<b>${cfg.timeLimitSec ? Math.floor(cfg.timeLimitSec/60)+'分'+(cfg.timeLimitSec%60)+'秒' : (cfg.timeLimitMin ? cfg.timeLimitMin + ' 分鐘' : '無限制')}</b>
              </p>
            </div>
            <button class="gold" style="font-size: 1.05rem;" onclick="startChallengeLevel(${lvl})">正式開始挑戰 ${cfg.name}</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function startChallengeLevel(lvlKey) {
  saveName($('challengeName')?.value || state.name);
  if (!state.name) { alert('請先輸入學生姓名！'); return; }

  state.currentLevel = Number(lvlKey);
  const cfg = LEVEL_CONFIGS[lvlKey];

  let picked = [];
  
  if (cfg.dist) {
    let pool1 = DATA.questions.filter(q => (q.gradeLevel || 1) === 1);
    let pool2 = DATA.questions.filter(q => q.gradeLevel === 2);
    let pool3 = DATA.questions.filter(q => q.gradeLevel === 3);
    
    let picked1 = pickABQuestions(pool1).slice(0, cfg.dist[1] || 0);
    let picked2 = pickABQuestions(pool2).slice(0, cfg.dist[2] || 0);
    let picked3 = pickABQuestions(pool3).slice(0, cfg.dist[3] || 0);
    
    let pickedExam = [];
    if (cfg.dist.exam && typeof DATA_EXAM !== 'undefined') {
      pickedExam = shuffle(DATA_EXAM.questions).slice(0, cfg.dist.exam);
    }
    
    picked = shuffle([...picked1, ...picked2, ...picked3, ...pickedExam]);
  } else {
    let pool = DATA.questions.filter(q => (q.gradeLevel || 1) <= 3);
    picked = pickABQuestions(pool).slice(0, cfg.total);
  }

  resetExamState();
  state.quiz = picked;
  state.mode = 'challenge';
  state.topic = cfg.name;

  if (cfg.timeLimitSec) {
    state.deadline = Date.now() + cfg.timeLimitSec * 1000;
    startTimer();
  } else if (cfg.timeLimitMin) {
    state.deadline = Date.now() + cfg.timeLimitMin * 60 * 1000;
    startTimer();
  }

  prepareQuestionsData();
  startBGM();
  renderQuiz();
}

function topics(v) {
  stopBGM();
  let allQs = (typeof DATA !== 'undefined' && DATA.questions) ? DATA.questions : [];
  let userLevel = state.selectedGradeLevel;

  let filteredQuestions = allQs.filter(q => {
    let qLevel = q.gradeLevel || 1;
    if (userLevel === 0) return true;
    if (userLevel === 1) return qLevel === 1;
    if (userLevel === 2) return qLevel <= 2;
    if (userLevel === 3) return qLevel <= 3;
    return true;
  });

  let groups = {};
  filteredQuestions.forEach(q => (groups[q.chapter] ??= []).push(q));

  v.innerHTML = `
    <div class="panel">
      <h2>📚 各主題推薦修練 (自主練功區)</h2>
      
      <div style="background: rgba(59, 130, 246, 0.08); border-left: 4px solid #3b82f6; padding: 12px 16px; border-radius: 6px; margin: 12px 0; font-size: 0.95rem;">
        💡 <b>修練說明：</b>本區為無壓力自主練習區，作答無時間限制、無及格門檻，<b>也不會發放任何認證章</b>。<br>
        若要取得正式認證章與證書，請返回首頁【勇者集章冊】進行限時 10 分鐘 20 題的「正式集章」！
      </div>
      
      <div class="grade-filter-group" style="margin-top: 20px;">
        <button class="grade-filter-btn ${userLevel===0?'active':''}" onclick="setGradeFilter(0)">全部主題</button>
        <button class="grade-filter-btn ${userLevel===1?'active':''}" onclick="setGradeFilter(1)">🌱 低年級推薦</button>
        <button class="grade-filter-btn ${userLevel===2?'active':''}" onclick="setGradeFilter(2)">🌿 中年級推薦</button>
        <button class="grade-filter-btn ${userLevel===3?'active':''}" onclick="setGradeFilter(3)">🌳 高年級推薦</button>
      </div>

      <div class="grid" style="margin-top: 20px;">
        ${ALL_TOPICS.filter(t => !t.includes("歷屆學檢")).map(t => {
          let qs = groups[t] || [];
          if (!qs.length) return '';
          let groupCount = new Set(qs.map(q => q.groupKey || q.id)).size;
          let testCount = userLevel === 1 ? 10 : (userLevel === 2 ? 15 : 20);
          testCount = Math.min(testCount, groupCount);
          
          return `
            <div class="card">
              <div>
                <div class="card-header">
                  <h3 class="card-title">${esc(t.replace('單字-', ''))}</h3>
                  <span class="pill">練習 ${testCount} 題</span>
                </div>
                <p class="muted" style="font-size:0.8rem; margin:6px 0;">題庫收錄 ${groupCount} 組核心題目</p>
              </div>
              <button class="secondary" onclick="startTopicPractice('${encodeURIComponent(t)}')" style="margin-top:14px; width:100%; font-size:1rem;">
                📖 開始自主練習
              </button>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function setGradeFilter(lvl) {
  state.selectedGradeLevel = lvl;
  render();
}

// 主題日常練習 (無壓力, 不計印章)
function startTopicPractice(enc) {
  state.topic = decodeURIComponent(enc);
  let allQs = DATA.questions;
  let userLevel = state.selectedGradeLevel; 

  let pool = allQs.filter(q => {
    if (q.chapter !== state.topic) return false;
    let qLevel = q.gradeLevel || 1;
    if (userLevel === 0) return true;
    if (userLevel === 1) return qLevel === 1;
    if (userLevel === 2) return qLevel === 2 || qLevel === 1; 
    if (userLevel === 3) return qLevel === 3 || qLevel === 2 || qLevel === 1;
    return true;
  });

  resetExamState();
  let allPicked = pickABQuestions(pool);
  
  let testCount = userLevel === 1 ? 10 : (userLevel === 2 ? 15 : 20);
  testCount = Math.min(testCount, allPicked.length);
  
  state.quiz = allPicked.slice(0, testCount);
  state.mode = 'practice'; // 自主練習
  prepareQuestionsData();
  startBGM();
  renderQuiz();
}

// 主題正式認證 (嚴格限時, 須達85%解鎖蓋章)
function startOfficialCertification(enc) {
  saveName($('studentName')?.value || state.name);
  if (!state.name) { alert('請先設定勇者姓名才能開始正式考核！'); return; }

  let topicTitle = decodeURIComponent(enc);
  state.topic = topicTitle;
  let allQs = DATA.questions;
  
  let pool = allQs.filter(q => q.chapter === topicTitle);
  let picked = pickABQuestions(pool).slice(0, 20); // 嚴格抽取 20 題

  if (picked.length < 5) {
     alert("此主題題數不足，無法進行正式認證。");
     return;
  }

  resetExamState();
  state.quiz = picked;
  state.mode = 'official_cert'; 
  // 嚴格限時 10 分鐘
  state.deadline = Date.now() + 10 * 60 * 1000; 

  startTimer();
  prepareQuestionsData();
  startBGM();
  renderQuiz();
}

function examsPage(v) {
  stopBGM();
  let examPassCount = state.history.filter(h => h.title.includes('歷屆學檢') && h.isPass).length;

  v.innerHTML = `
    <div class="panel">
      <h2>📝 歷屆學檢考古特訓（高年級真題專區）</h2>
      <p class="muted">嚴選 110～115 學年度縣市學檢官方真題！累積完成 3 次達標測驗即可解鎖第 15 號【歷屆學檢特訓章】！</p>

function startExamByDifficulty(diffLevel, count, titleText) {
  saveName($('examStudentName')?.value || state.name);
  if (!state.name) { alert('請先輸入學生姓名！'); return; }

  let allExamQs = (typeof DATA_EXAM !== 'undefined' && DATA_EXAM.questions) ? DATA_EXAM.questions : [];
  if (allExamQs.length === 0) { alert("題庫載入中，請稍候！"); return; }

  let pool = allExamQs;
  if (diffLevel > 0) {
      pool = allExamQs.filter(q => (q.gradeLevel || 2) === diffLevel);
  }
  if (pool.length < count) pool = allExamQs;

  resetExamState();
  state.quiz = shuffle(pool).slice(0, count);
  state.mode = 'exam_cert'; 
  state.topic = `歷屆學檢考古特訓 - ${titleText}`;
  state.deadline = Date.now() + 15 * 60 * 1000; // 考古特訓 15 分鐘

  prepareQuestionsData();
  startTimer();
  startBGM();
  renderQuiz();
}

function searchVocab(kw) {
  kw = kw.toLowerCase().trim();
  let accs = document.querySelectorAll('.vocab-accordion');
  
  if (!kw) {
    toggleAllAccordions(false);
    document.getElementById('acc_0').classList.add('open');
    document.querySelectorAll('.vocab-word-item').forEach(el => el.style.display = '');
    return;
  }

  accs.forEach(acc => {
    let hasMatch = false;
    let items = acc.querySelectorAll('.vocab-word-item');
    items.forEach(item => {
      let w = item.getAttribute('data-word');
      let m = item.getAttribute('data-meaning');
      if (w.includes(kw) || m.includes(kw)) {
        item.style.display = '';
        hasMatch = true;
      } else {
        item.style.display = 'none';
      }
    });
    if (hasMatch) {
      acc.classList.add('open');
      acc.style.display = '';
    } else {
      acc.classList.remove('open');
      acc.style.display = 'none';
    }
  });
}

function toggleAccordion(id) {
  let el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function toggleAllAccordions(forceOpen) {
  document.querySelectorAll('.vocab-accordion').forEach(el => {
    el.style.display = '';
    if (forceOpen) el.classList.add('open');
    else el.classList.remove('open');
  });
  let items = document.querySelectorAll('.vocab-word-item');
  items.forEach(item => item.style.display = '');
  let inp = document.getElementById('vocabSearch');
  if (inp) inp.value = '';
}


function resetExamState() {
  state.idx = 0;
  state.userSelections = {};
  state.submittedQuestions = {};
  state.answers = [];
  state.correctCount = 0;
  state.totalAnswered = 0;
  state.deadline = null; 
}

function prepareQuestionsData() {
  state.quiz.forEach((q) => {
    if (!q.shuffledOptions) {
      q.shuffledOptions = shuffle([...q.options]);
    }
  });
}

function startTimer() {
  if (window.kgTimer) clearInterval(window.kgTimer);
  
  window.kgTimer = setInterval(() => {
    let remain = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
    let el = $('timerText');
    if (el) {
      let mins = String(Math.floor(remain / 60)).padStart(2, '0');
      let secs = String(remain % 60).padStart(2, '0');
      el.textContent = `${mins}:${secs}`;
    }

    if (remain <= 0) {
      clearInterval(window.kgTimer);
      window.kgTimer = null;
      alert('⏰ 時間到！系統將自動為您交卷結算成績。');
      finishQuiz();
    }
  }, 1000);
}

function renderQuiz() {
  let q = state.quiz[state.idx];
  if (!q) { finishQuiz(); return; }

  let v = $('view');
  let isSubmitted = !!state.submittedQuestions[state.idx];
  let selectedIndex = state.userSelections[state.idx];

  let initialTimerText = "";
  if (state.deadline) {
    let remain = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
    let mins = String(Math.floor(remain / 60)).padStart(2, '0');
    let secs = String(remain % 60).padStart(2, '0');
    initialTimerText = `${mins}:${secs}`;
  }

  let targetAnsText = q.answerText;
  let praiseWord = state.quiz[state.idx].praiseWord || "Great";

  let accuracy = state.totalAnswered > 0 
    ? Math.round((state.correctCount / state.totalAnswered) * 100) 
    : 100;

  let modeBadge = state.mode === 'practice' ? '<span class="pill" style="background:#e2e8f0; color:#475569;">自主練功模式</span>' 
                : state.mode === 'official_cert' ? '<span class="pill" style="background:#fef08a; color:#854d0e;">⚠️ 正式考核模式</span>'
                : '<span class="pill" style="background:#fecaca; color:#991b1b;">🔥 挑戰賽模式</span>';

  v.innerHTML = `
    <div class="panel quiz-panel">
      <div class="row">
        <div>
          <span class="pill" style="margin-right:8px;">${esc(q.chapter)}</span>
          ${modeBadge}
        </div>
        <span class="muted">
          ${state.deadline ? `⏱️ 剩餘時間：<b id="timerText" style="color:#ef4444; font-size:1.1rem;">${initialTimerText}</b> ・ ` : ''}
          第 ${state.idx + 1} / ${state.quiz.length} 題 （即時答對率：<b style="color:#22c55e;">${accuracy}%</b>）
        </span>
      </div>
      <div class="progress"><span style="width:${((state.idx + 1) / state.quiz.length) * 100}%"></span></div>
      
      <div class="qtext">${esc(q.question)}</div>

      <div class="row quiz-action-row" style="margin-bottom: 16px; margin-top: 10px;">
        ${isSubmitted ? `
          ${state.idx === state.quiz.length - 1 ? 
            `<button class="gold" onclick="finishQuiz()" style="font-size:1.05rem;">完成結算 🏆</button>` : 
            `<button class="gold" onclick="nextQuestion()" style="font-size:1.05rem;">下一題 ➡️</button>`
          }
        ` : `
          <button id="submitBtn" ${selectedIndex === undefined ? 'disabled' : ''} onclick="submitAnswer()" class="gold" style="font-size:1.05rem;">送出答案</button>
        `}
        <div style="display: flex; gap: 8px;">
          ${state.idx > 0 ? `<button class="secondary" onclick="prevQuestion()">⬅️ 上一題</button>` : ''}
          <button class="secondary" onclick="leaveQuiz()">離開測驗</button>
        </div>
      </div>

      <div class="options">
        ${q.shuffledOptions.map((o, i) => {
          let btnClass = "";
          if (isSubmitted) {
            if (o.text === targetAnsText) {
              btnClass = "correct";
            } else if (i === selectedIndex && o.text !== targetAnsText) {
              btnClass = "wrong";
            }
          } else if (i === selectedIndex) {
            btnClass = "selected";
          }

          return `
            <button id="opt${i}" class="${btnClass}" onclick="selectOption(${i})">
              <span class="opt-prefix">${String.fromCharCode(65 + i)}</span>
              <span class="opt-text">${esc(o.text)}</span>
            </button>
          `;
        }).join('')}
      </div>

      <div id="feedback">
        ${isSubmitted ? `
          <div class="feedback ${q.shuffledOptions[selectedIndex]?.text === targetAnsText ? 'pass' : 'fail'}">
            <b>${q.shuffledOptions[selectedIndex]?.text === targetAnsText ? `🎉 ${praiseWord}! 答對了！` : '❌ 答錯囉，再接再勵！'}</b>
            <div style="line-height: 1.6; margin-top: 8px; font-size: 0.95rem;">
              <div style="margin-bottom:10px;"><b>【正確答案】：(${String.fromCharCode(65 + q.shuffledOptions.findIndex(o => o.text === targetAnsText))}) ${esc(targetAnsText)}</b></div>
              <div style="margin-bottom:10px; white-space:pre-wrap;">${esc(q.hint)}</div>
              <div><b>【選項對照】：</b><br>
              ${q.shuffledOptions.map((opt, idx) => `(${String.fromCharCode(65 + idx)}) ${esc(opt.desc)}`).join('<br>')}
              </div>
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function selectOption(i) {
  if (state.submittedQuestions[state.idx]) return;
  state.userSelections[state.idx] = i;

  for (let bIdx = 0; bIdx < state.quiz[state.idx].shuffledOptions.length; bIdx++) {
    let btn = $(`opt${bIdx}`);
    if (btn) btn.classList.remove('selected');
  }

  let selBtn = $(`opt${i}`);
  if (selBtn) selBtn.classList.add('selected');

  $('submitBtn').disabled = false;
}

function submitAnswer() {
  let selectedIndex = state.userSelections[state.idx];
  if (selectedIndex === undefined || state.submittedQuestions[state.idx]) return;

  state.submittedQuestions[state.idx] = true;
  state.totalAnswered++;

  let q = state.quiz[state.idx];
  let selectedText = q.shuffledOptions[selectedIndex].text;
  let targetAnsText = q.answerText;
  let isCorrect = (selectedText === targetAnsText);

  if (isCorrect) {
    state.correctCount++;
    const praiseList = ["Great", "Good", "Nice", "Perfect"];
    let randomPraise = praiseList[Math.floor(Math.random() * praiseList.length)];
    state.quiz[state.idx].praiseWord = randomPraise;
    playCorrectFeedback(randomPraise);
  } else {
    playWrongFeedback();
  }

  renderQuiz();
}

function prevQuestion() {
  if (state.idx > 0) {
    state.idx--;
    renderQuiz();
  }
}

function nextQuestion() {
  if (state.idx < state.quiz.length - 1) {
    state.idx++;
    renderQuiz();
  }
}

function leaveQuiz() { 
  if (confirm("確定要離開測驗嗎？未完成的成績將不會被儲存。")) {
    stopBGM();
    if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }
    go('home'); 
  }
}

function finishQuiz() {
  stopBGM();
  if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }

  let total = state.quiz.length;
  let correct = state.correctCount;
  let score = total > 0 ? Math.round((correct / total) * 100) : 0;

  // 判定門檻：日常練習不設門檻，正式蓋章預設 85%，考古題預設 80%，關卡依據設定
  let reqScore = 0;
  if (state.mode === 'official_cert') reqScore = 85;
  if (state.mode === 'exam_cert') reqScore = 80;
  if (state.mode === 'challenge') {
    let cfg = LEVEL_CONFIGS[state.currentLevel];
    reqScore = cfg ? cfg.passRate * 100 : 80;
  }

  let isPass = score >= reqScore;
  
  if (isPass && state.mode !== 'practice') playVictorySound();

  // 僅正式模式存入印章
  if (isPass && state.mode === 'official_cert') {
    state.stamps[state.topic] = {
      score, date: new Date().toLocaleDateString('zh-TW'), name: state.name || '英語小英雄'
    };
    localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
  } else if (isPass && state.mode === 'challenge') {
    state.stamps[LEVEL_CONFIGS[state.currentLevel].stampKey] = {
      score, date: new Date().toLocaleDateString('zh-TW'), name: state.name || '英語小英雄'
    };
    localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
  }

  // 將記錄存入歷史
  let titleStr = state.topic;
  if (state.mode === 'practice') titleStr += ' (自主練習)';
  if (state.mode === 'official_cert') titleStr += ' [正式認證]';
  if (state.mode === 'exam_cert') titleStr += ' [歷屆學檢特訓]';

  state.history.unshift({
    date: new Date().toLocaleString('zh-TW', { hour12: false }),
    name: state.name || '英語小英雄',
    title: titleStr, score, correct, total, isPass
  });
  localStorage.setItem('kgHistory', JSON.stringify(state.history));

  let badgeIcon = isPass ? '🏅' : '💪';
  if (state.mode === 'challenge') badgeIcon = isPass ? (LEVEL_CONFIGS[state.currentLevel]?.icon || '🏅') : '💪';
  
  let resultHtml = `
    <div class="panel" style="text-align:center;">
      <div style="font-size:4rem">${badgeIcon}</div>
      <h2>${esc(state.topic)} - 測驗結果</h2>
      <p class="muted">英雄玩家：<b>${esc(state.name || '英語小英雄')}</b></p>
      <div style="font-size:3.5rem; font-weight:900; color:${isPass ? '#22c55e' : '#f3b63f'};">${score} 分</div>
      <p style="font-size:1.1rem; font-weight:bold;">答對 ${correct} 題 / 共 ${total} 題</p>
  `;

  if (state.mode === 'practice') {
    resultHtml += `
      <div class="notice" style="background:#e0f2fe; border-left-color:#38bdf8;">
        <b>自主練習完成！</b><br>
        很棒！練習不計入集章，若您準備好了，可以到首頁點擊【開始正式集章】進行考核喔！
      </div>`;
  } else if (state.mode === 'exam_cert') {
     resultHtml += `
      <div class="notice">
        <b>特訓進度狀況：${isPass ? '特訓達標！' : '未達標準（需 ' + reqScore + '%）'}</b><br>
        ${isPass ? '太厲害了！已為您記錄 1 次學檢特訓，累計 3 次即可解鎖第 15 號勳章！' : '別灰心，查看詳解後再次挑戰！'}
      </div>`;
  } else {
    resultHtml += `
      <div class="notice">
        <b>認證印章狀況：${isPass ? '成功解鎖認證章！' : '未達標準（需 ' + reqScore + '%）'}</b><br>
        ${isPass ? '恭喜成功蓋章！已為您儲存至【我的認證集章冊】中。' : '再試一次即可順利解鎖印章！'}
      </div>`;
  }

  resultHtml += `
      <div class="row" style="justify-content:center; margin-top:20px;">
        ${(isPass && state.mode !== 'practice' && state.mode !== 'exam_cert') ? `<button class="gold" style="font-size:1.05rem;" onclick="downloadResult()">📜 列印 / 下載認證證書</button>` : ''}
        <button class="secondary" style="font-size:1.05rem;" onclick="go('home')">檢視我的集章冊</button>
      </div>
    </div>
  `;

  $('view').innerHTML = resultHtml;
}


function importHistory(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n');
    let importedCount = 0;

    for (let i = 1; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) continue;

      let cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      if (!cols || cols.length < 4) continue;

      let title = cols[0].replace(/"/g, '').trim();
      let score = parseInt(cols[1].replace(/"/g, '').trim(), 10);
      let date = cols[2].replace(/"/g, '').trim();
      let name = cols[3].replace(/"/g, '').trim();

      let key = title.includes('425') ? 'king' 
              : title.includes('325') ? 'challenge_325'
              : title.includes('100') ? 'challenge_100' 
              : title.includes('50') ? 'challenge_50' 
              : title.includes('30') ? 'challenge_30'
              : title;

      if (!state.stamps[key] || score >= state.stamps[key].score) {
        state.stamps[key] = { score, date, name };
        importedCount++;
      }

      if (name && !state.name) {
        saveName(name);
      }
    }

    if (importedCount > 0) {
      localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
      alert(`🎉 成功匯入並更新了 ${importedCount} 項認證紀錄！`);
      render();
    } else {
      alert('⚠️ 備份檔中無新紀錄，或分數未高於現有紀錄。');
    }
    event.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function exportHistory() {
  if (!Object.keys(state.stamps).length && !state.history.length) {
    alert('目前尚無集章與歷程紀錄！'); return;
  }
  let csv = "﻿認證項目/主題,高分紀錄,獲章日期,英雄姓名\n";
  Object.entries(state.stamps).forEach(([k, v]) => {
    let title = (k==='king')?'435英雄金章':(k==='challenge_325')?'325題金章':(k==='challenge_100')?'100題銀章':(k==='challenge_50')?'50題銅章':(k==='challenge_30')?'30題新手章':k;
    csv += `"${title}",${v.score},"${v.date}","${v.name}"\n`;
  });
  let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `英語英雄網_認證集章冊_${state.name||'學生'}.csv`;
  a.click();
}

function toggleTheme() {

  document.documentElement.dataset.theme = dark ? 'dark' : 'light';

}

function toggleSound() {
  state.soundEnabled = !state.soundEnabled;
  $('soundIcon').textContent = state.soundEnabled ? '🔊' : '🔇';
  $('soundText').textContent = state.soundEnabled ? '音效：開啟' : '音效：靜音';
}

function toggleBGM() {
  state.bgmEnabled = !state.bgmEnabled;
  $('bgmIcon').textContent = state.bgmEnabled ? '🎵' : '🔇';
  $('bgmText').textContent = state.bgmEnabled ? '音樂：開啟' : '音樂：靜音';
  
  if (!state.bgmEnabled) {
    stopBGM();
  } else if (state.quiz && state.quiz.length && state.submittedQuestions) {
    startBGM();
  }
}

function startBGM() {
  if (!state.bgmEnabled || bgmInterval) return;
  
  let ctx = getAudioContext();
  let step = 0;
  const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 349.23];

  bgmInterval = setInterval(() => {
    if (!state.bgmEnabled) return;
    try {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
      
      gain.gain.setValueAtTime(0.04, ctx.currentTime); 
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
      step++;
    } catch(e) {}
  }, 220);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function speakText(text) {
  if (!state.soundEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.8; // 稍微調快發音速度
  window.speechSynthesis.speak(u);
}

function playCorrectFeedback(word) {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.28);
  } catch(e) {}
  
  setTimeout(() => {
    speakText(word || "Great!");
  }, 180);
}

function playWrongFeedback() {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } catch(e) {}
}

function playVictorySound() {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.12);
      osc.stop(ctx.currentTime + idx * 0.12 + 0.45);
    });
  } catch(e) {}
}

function saveNameFromModal() {
  const inp = $('modalNameInput');
  const val = inp ? inp.value.trim() : '';
  if (!val) {
    alert('請輸入勇者姓名才能出發喔！');
    return;
  }
  saveName(val);
  closeHelp();
  render();
}

function updateFooterHeroName() {
  const el = $('footerHeroName');
  if (el) el.textContent = state.name || '尚未設定';
}

function saveName(val) {
  setTimeout(updateFooterHeroName, 0);
  state.name = val.trim();
  localStorage.setItem('kgName', state.name);
  
  if (state.stamps && Object.keys(state.stamps).length > 0) {
    Object.keys(state.stamps).forEach(k => {
      if (state.stamps[k]) {
        state.stamps[k].name = state.name;
      }
    });
    localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
  }
}

function closeHelp() { 
  $('modalRoot').innerHTML = ''; 
}

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

window.addEventListener('DOMContentLoaded', () => {
  document.documentElement.dataset.theme = 'light';
  render();
  checkFirstTimeUser();
});
