function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function pickABQuestions(sourcePool) {
  let groups = {};
  sourcePool.forEach(q => {
    let key = q.groupKey || q.id;
    (groups[key] ??= []).push(q);
  });

  let selected = [];
  Object.values(groups).forEach(versions => {
    let picked = shuffle(versions)[0];
    selected.push({...picked, shuffledOptions: null});
  });
  return shuffle(selected);
}

function renderNav() {
  const navEl = $('nav');
  if (!navEl) return;
  navEl.innerHTML = pages.map(([id, name]) => 
    `<button class="${state.page === id ? 'active' : ''}" onclick="go('${id}')">${name}</button>`
  ).join('');
}

function go(p) {
  state.quizActive = false;
  stopBGM();
  if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }
  state.page = p;
  renderNav();
  render();
}

function render() {
  renderNav();
  const v = $('view');
  if (!v) return;
  if (state.page === 'home') home(v);
  if (state.page === 'topics') topics(v);
  if (state.page === 'challenges') challenges(v);
  if (state.page === 'vocabulary') vocabulary(v);
}

function startLevel(lvlKey) {
  saveName($('challengeName')?.value || state.name);
  if (!state.name) { alert('請先輸入學生姓名，再開始認證挑戰。'); if (state.page !== 'challenges') go('challenges'); return; }

  state.currentLevel = Number(lvlKey);
  const cfg = LEVEL_CONFIGS[lvlKey];

  let pool = DATA.questions.filter(q => cfg.poolFilter === "ALL" || (q.gradeLevel || 1) <= cfg.poolFilter);
  let picked = pickABQuestions(pool);
  if (picked.length < cfg.total) {
    alert(`此關卡目前只有 ${picked.length} 道不重複題目，尚不足 ${cfg.total} 題。請先補足題庫，避免重複題影響評量。`);
    return;
  }
  picked = picked.slice(0, cfg.total).map(q => ({...q, shuffledOptions: null}));

  resetExamState();
  state.quiz = picked;
  state.mode = 'challenge';
  state.quizActive = true;
  state.topic = cfg.name;

  if (cfg.timeLimitMin) {
    state.deadline = Date.now() + cfg.timeLimitMin * 60 * 1000;
    startTimer();
  }

  prepareQuestionsData();
  startBGM();
  renderQuiz();
}

let visibleFlashcards = VOCAB_FLASHCARDS.slice();
let flashcardIndex = 0;
function renderVocabCards(items) {
  if (!items.length) return '<p class="muted">找不到符合的單字，試試其他關鍵字。</p>';
  return items.map((item,i) => `<button type="button" class="vocab-card flashcard" aria-label="翻轉卡片：${esc(item.word)}" onclick="flipFlashcard(this)" data-card-index="${i}"><span class="flashcard-front"><span class="vocab-word">${esc(item.word)}</span><span class="vocab-meta">${esc(item.category)}</span><span class="muted">點擊翻面看中文</span></span><span class="flashcard-back"><span class="vocab-meaning">${esc(item.meaning)}</span><span class="vocab-meta">${esc(item.note)}</span></span></button>`).join('');
}
function flipFlashcard(card) { card.classList.toggle('is-flipped'); }
function flipAllFlashcards() { document.querySelectorAll('#vocabResults .flashcard').forEach(card=>card.classList.toggle('is-flipped')); }
function moveFlashcard(step) {
  const cards=[...document.querySelectorAll('#vocabResults .flashcard')]; if(!cards.length)return;
  cards.forEach(c=>c.classList.remove('is-current'));
  flashcardIndex=(flashcardIndex+step+cards.length)%cards.length;
  cards[flashcardIndex].classList.add('is-current'); cards[flashcardIndex].scrollIntoView({behavior:'smooth',block:'nearest'});
}
function filterVocab(value) {
  const term = String(value || '').trim().toLowerCase();
  visibleFlashcards = VOCAB_FLASHCARDS.filter(item => [item.word,item.meaning,item.category,item.note].some(v => String(v).toLowerCase().includes(term)));
  flashcardIndex=0;
  const target = $('vocabResults');
  if (target) target.innerHTML = renderVocabCards(visibleFlashcards);
}

function startTopic(enc) {
  saveName($('studentName')?.value || state.name);
  state.topic = decodeURIComponent(enc);
  
  let allQs = DATA.questions;
  let userLevel = state.selectedGradeLevel;

  let pool = allQs.filter(q => {
    if (q.chapter !== state.topic) return false;
    let qLevel = q.gradeLevel || 1;
    if (userLevel === 0) return true;
    if (userLevel === 1) return qLevel === 1;
    if (userLevel === 2) return qLevel <= 2;
    if (userLevel === 3) return qLevel <= 3;
    return true;
  });

  resetExamState();
  state.quiz = pickABQuestions(pool).map(q => ({...q, shuffledOptions: null}));
  if (!state.quiz.length) { alert('這個主題在目前推薦難度下暫時沒有題目，請切換難度或選擇其他主題。'); return; }
  state.mode = 'topic';
  state.quizActive = true;
  prepareQuestionsData();
  startBGM();
  renderQuiz();
}

function resetExamState() {
  if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }
  state.deadline = null;
  state.idx = 0;
  state.userSelections = {};
  state.submittedQuestions = {};
  state.answers = [];
  state.correctCount = 0;
  state.totalAnswered = 0;
}

function prepareQuestionsData() {
  state.quiz.forEach((q) => {
    // 題庫選項順序本身已打散，且 explanation 的 A/B/C/D 對應此原始順序。
    // 顯示時不可再次洗牌，否則詳解中的選項字母會與畫面不一致。
    const options = Array.isArray(q.options) && q.options.length ? q.options : ['O', 'X'];
    q.shuffledOptions = options.map((text, i) => ({ text, orig: i }));
  });
}

function startTimer() {
  if (window.kgTimer) clearInterval(window.kgTimer);
  
  window.kgTimer = setInterval(() => {
    let remain = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
    let el = $('timerText');
    if (el) {
      let mins = String(Math.floor(remain / 60)).padStart(2, '0');
      let secs = String(remain % 60).padStart(2, '0');
      el.textContent = `${mins}:${secs}`;
    }

    if (remain <= 0) {
      clearInterval(window.kgTimer);
      window.kgTimer = null;
      alert('⏰ 時間到！系統將自動為您交卷結算成績。');
      finishQuiz();
    }
  }, 1000);
}

function renderQuiz() {
  let q = state.quiz[state.idx];
  if (!q) { finishQuiz(); return; }

  let v = $('view');
  let isSubmitted = !!state.submittedQuestions[state.idx];
  let selectedIndex = state.userSelections[state.idx];

  let initialTimerText = "";
  if (state.deadline) {
    let remain = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
    let mins = String(Math.floor(remain / 60)).padStart(2, '0');
    let secs = String(remain % 60).padStart(2, '0');
    initialTimerText = `${mins}:${secs}`;
  }

  let targetAnsText = q.options[q.answer.charCodeAt(0) - 65] || q.answer;
  let praiseWord = state.quiz[state.idx].praiseWord || "Great";

  let accuracy = state.totalAnswered > 0 
    ? Math.round((state.correctCount / state.totalAnswered) * 100) 
    : 100;

  v.innerHTML = `
    <div class="panel quiz-panel">
      <div class="row">
        <div>
          <span class="pill">${esc(q.chapter)}</span>
        </div>
        <span class="muted">
          ${state.deadline ? `⏱️ 剩餘時間：<b id="timerText" style="color:#ef4444;">${initialTimerText}</b> ・ ` : ''}
          第 ${state.idx + 1} / ${state.quiz.length} 題 （即時答對率：<b style="color:#22c55e;">${accuracy}%</b>）
        </span>
      </div>
      <div class="progress"><span style="width:${((state.idx + 1) / state.quiz.length) * 100}%"></span></div>
      
      <div class="qtext">${esc(q.question)}</div>

<div class="row quiz-action-row" style="margin-bottom: 16px; margin-top: 10px;">
        <!-- 1. 將主要的送出/下一題按鈕移到左邊 -->
        ${isSubmitted ? `
          ${state.idx === state.quiz.length - 1 ? 
            `<button class="gold" onclick="finishQuiz()">完成結算 🏆</button>` : 
            `<button class="gold" onclick="nextQuestion()">下一題 ➡️</button>`
          }
        ` : `
          <button id="submitBtn" ${selectedIndex === undefined ? 'disabled' : ''} onclick="submitAnswer()" class="gold">送出答案</button>
        `}

        <!-- 2. 次要按鈕（上一題、離開測驗）移至右側 -->
        <div style="display: flex; gap: 8px;">
          ${state.idx > 0 ? `<button class="secondary" onclick="prevQuestion()">⬅️ 上一題</button>` : ''}
          <button class="secondary" onclick="leaveQuiz()">離開測驗</button>
        </div>
      </div>

      <div class="options">
        ${q.shuffledOptions.map((o, i) => {
          let btnClass = "";
          if (isSubmitted) {
            if (o.text === targetAnsText) {
              btnClass = "correct";
            } else if (i === selectedIndex && o.text !== targetAnsText) {
              btnClass = "wrong";
            }
          } else if (i === selectedIndex) {
            btnClass = "selected";
          }

          return `
            <button id="opt${i}" class="${btnClass}" onclick="selectOption(${i})">
              <span class="opt-prefix">${String.fromCharCode(65 + i)}</span>
              <span class="opt-text">${esc(o.text)}</span>
            </button>
          `;
        }).join('')}
      </div>

      <div id="feedback">
        ${isSubmitted ? `
          <div class="feedback ${q.shuffledOptions[selectedIndex]?.text === targetAnsText ? 'pass' : 'fail'}">
            <b>${q.shuffledOptions[selectedIndex]?.text === targetAnsText ? `🎉 ${praiseWord}! 答對了！` : '❌ 答錯囉，再接再勵！'}</b>
            <p style="white-space: pre-line; line-height: 1.6; margin-top: 8px;">${esc(q.explanation)}</p>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function selectOption(i) {
  if (state.submittedQuestions[state.idx]) return;
  state.userSelections[state.idx] = i;

  for (let bIdx = 0; bIdx < state.quiz[state.idx].shuffledOptions.length; bIdx++) {
    let btn = $(`opt${bIdx}`);
    if (btn) btn.classList.remove('selected');
  }

  let selBtn = $(`opt${i}`);
  if (selBtn) selBtn.classList.add('selected');

  $('submitBtn').disabled = false;
}

function submitAnswer() {
  let selectedIndex = state.userSelections[state.idx];
  if (selectedIndex === undefined || state.submittedQuestions[state.idx]) return;

  state.submittedQuestions[state.idx] = true;
  state.totalAnswered++;

  let q = state.quiz[state.idx];
  let selectedText = q.shuffledOptions[selectedIndex].text;
  let targetAnsText = q.options[q.answer.charCodeAt(0) - 65] || q.answer;
  let isCorrect = (selectedText === targetAnsText);

  if (isCorrect) {
    state.correctCount++;
    const praiseList = ["Great", "Good", "Nice", "Perfect"];
    let randomPraise = praiseList[Math.floor(Math.random() * praiseList.length)];
    state.quiz[state.idx].praiseWord = randomPraise;
    playCorrectFeedback(randomPraise);
  } else {
    playWrongFeedback();
  }

  renderQuiz();
}

function prevQuestion() {
  if (state.idx > 0) {
    state.idx--;
    renderQuiz();
  }
}

function nextQuestion() {
  if (state.idx < state.quiz.length - 1) {
    state.idx++;
    renderQuiz();
  }
}

function leaveQuiz() { 
  if (confirm("確定要離開測驗嗎？未完成的成績將不會被儲存。")) {
    state.quizActive = false;
    stopBGM();
    if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }
    go('home'); 
  }
}

function finishQuiz() {
  state.quizActive = false;
  stopBGM();
  if (window.kgTimer) { clearInterval(window.kgTimer); window.kgTimer = null; }

  let total = state.quiz.length;
  let correct = state.correctCount;
  let score = total > 0 ? Math.round((correct / total) * 100) : 0;

  let reqScore = 80;
  let requiredCorrect = null;
  if (state.mode === 'challenge') {
    let cfg = LEVEL_CONFIGS[state.currentLevel];
    reqScore = cfg ? cfg.passRate * 100 : 80;
    requiredCorrect = cfg ? cfg.reqCorrect : null;
  }

  // 關卡以明確答對題數判定，避免 94.94% 四捨五入成 95% 而誤判通過。
  let isPass = requiredCorrect !== null ? correct >= requiredCorrect : score >= reqScore;
  
  let stampKey = state.mode === 'challenge' 
    ? LEVEL_CONFIGS[state.currentLevel].stampKey 
    : (state.mode === 'practice' ? null : state.topic);

  let badgeIcon = isPass 
    ? (state.mode === 'challenge' ? (LEVEL_CONFIGS[state.currentLevel]?.icon || '🏅') : '🌟') 
    : '💪';

  if (isPass) playVictorySound();

  let dateStr = new Date().toLocaleDateString('zh-TW');
  if (isPass && stampKey) {
    state.stamps[stampKey] = {
      score, date: dateStr, name: state.name || '國光小英雄'
    };
    localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
  }

  state.history.unshift({
    date: new Date().toLocaleString('zh-TW', { hour12: false }),

      <div class="notice">
        <b>認證印章狀況：${state.mode === 'practice' ? (isPass ? '練習表現很棒！' : '這次先找出需要加強的地方。') : (isPass ? '成功解鎖認證章！' : '未達標準（需 ' + reqScore + '%）')}</b><br>
        ${state.mode === 'practice' ? '這是題庫隨機練習紀錄，不會冒充正式歷屆原卷，也不會自動解鎖認證章。' : (isPass ? '恭喜成功蓋章！已為您儲存至【我的認證集章冊】中。' : '再試一次即可順利解鎖印章！')}
      </div>

        <button class="secondary" onclick="go('home')">檢視我的集章冊</button>
      </div>
    </div>
  `;
}

function importHistory(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n');
    let importedCount = 0;

    for (let i = 1; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line) continue;

      let cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      if (!cols || cols.length < 4) continue;

      let title = cols[0].replace(/"/g, '').trim();
      let score = parseInt(cols[1].replace(/"/g, '').trim(), 10);
      let date = cols[2].replace(/"/g, '').trim();
      let name = cols[3].replace(/"/g, '').trim();

      let key = title.includes('435') || title.includes('425') ? 'king' 
              : title.includes('325') ? 'challenge_325'
              : title.includes('100') ? 'challenge_100' 
              : title.includes('50') ? 'challenge_50' 
              : title.includes('30') ? 'challenge_30'
              : title;

      if (!state.stamps[key] || score >= state.stamps[key].score) {
        state.stamps[key] = { score, date, name };
        importedCount++;
      }

      if (name && !state.name) {
        saveName(name);
      }
    }

    if (importedCount > 0) {
      localStorage.setItem('kgStamps', JSON.stringify(state.stamps));
      alert(`🎉 成功匯入並更新了 ${importedCount} 項認證紀錄！`);
      render();
    } else {
      alert('⚠️ 備份檔中無新紀錄，或分數未高於現有紀錄。');
    }
    event.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function exportHistory() {
  if (!Object.keys(state.stamps).length && !state.history.length) {
    alert('目前尚無集章與歷程紀錄！'); return;
  }
  let csv = "\uFEFF認證項目/主題,高分紀錄,獲章日期,英雄姓名\n";
  Object.entries(state.stamps).forEach(([k, v]) => {
    let title = (k==='king')?'435英雄金章':(k==='challenge_325')?'325題金章':(k==='challenge_100')?'100題銀章':(k==='challenge_50')?'50題銅章':(k==='challenge_30')?'30題新手章':k;
    csv += `"${title}",${v.score},"${v.date}","${v.name}"\n`;
  });
  let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `國光英雄網_認證集章冊_${state.name||'學生'}.csv`;
  a.click();
}

function toggleBGM() {
  state.bgmEnabled = !state.bgmEnabled;
  $('bgmIcon').textContent = state.bgmEnabled ? '🎵' : '🔇';
  $('bgmText').textContent = state.bgmEnabled ? '音樂：開啟' : '音樂：靜音';
  
  if (!state.bgmEnabled) {
    stopBGM();
  } else if (state.quizActive) {
    startBGM();
  }
}

function startBGM() {
  if (!state.bgmEnabled || !state.quizActive || bgmInterval) return;
  
  let ctx = getAudioContext();
  let step = 0;
  const isFinalBattle = state.mode === 'challenge' && state.currentLevel === 5;
  const notes = isFinalBattle
    ? [523.25, 659.25, 783.99, 1046.50, 783.99, 880.00, 987.77, 1046.50]
    : [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 349.23];

  bgmInterval = setInterval(() => {
    if (!state.bgmEnabled) return;
    try {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
      
      gain.gain.setValueAtTime(isFinalBattle ? 0.035 : 0.018, ctx.currentTime); 
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (isFinalBattle ? 0.20 : 0.16));
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
      step++;
    } catch(e) {}
  }, isFinalBattle ? 180 : 340);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function playCorrectFeedback(word) {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.28);
  } catch(e) {}
  
}

function playWrongFeedback() {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(240, ctx.currentTime);
    osc.frequency.setValueAtTime(210, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } catch(e) {}
}

function playVictorySound() {
  if (!state.soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.12);
      osc.stop(ctx.currentTime + idx * 0.12 + 0.45);
    });
  } catch(e) {}
}

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
